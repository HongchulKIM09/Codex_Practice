<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>숫자 카운터</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="counter">
      <h1>숫자 카운터</h1>
      <p class="description">버튼으로 숫자를 1씩 올리거나 내려보세요.<br />최소 숫자는 -10입니다.</p>
      <output id="count" aria-live="polite" aria-atomic="true">0</output>
      <div class="buttons">
        <button id="decrement" type="button">− 마이너스</button>
        <button id="increment" type="button">+ 플러스</button>
      </div>
    </main>
  </body>
</html>
