<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>숫자 카운터</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="counter">
      <h1>숫자 카운터</h1>
      <p class="description">버튼을 눌러 숫자를 하나씩 올려보세요.</p>
      <output id="count" aria-live="polite" aria-atomic="true">0</output>
      <button id="increment" type="button">+1 증가</button>
    </main>
  </body>
</html>
